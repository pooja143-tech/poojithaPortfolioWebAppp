
<div class="bg-[#111] bg-opacity-70 text-white min-h-screen py-12 px-6 md:px-12">

  <div class="mb-16">
    <h1 class="text-5xl font-bold text-red-500 mb-4">My Skills</h1>
    <p class="text-xl text-gray-300">A comprehensive overview of my technical expertise</p>
  </div>

  <!-- Skills Carousel Section -->
  <div class="space-y-12">
    @for (section of projectSkills; track section) {
      <div class="skills-section">
        <app-carousel [projectData]="section"></app-carousel>
      </div>
    }
  </div>
</div>
