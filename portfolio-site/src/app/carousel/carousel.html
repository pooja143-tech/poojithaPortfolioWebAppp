
<div class="relative">
  <button
    (click)="scrollLeft()"
    class="absolute left-2 top-1/2 -translate-y-1/2 z-10 bg-white p-2 mx-5 rounded-full shadow hover:bg-gray-200 "
  >
    ◀
  </button>
  <button
    (click)="scrollRight()"
    class="absolute right-2 top-1/2 -translate-y-1/2 z-10 bg-white p-2 mx-5 rounded-full shadow hover:bg-gray-200"
  >
    ▶
  </button>
<div
  #carousel
  class="overflow-x-auto whitespace-nowrap scroll-smooth snap-x snap-mandatory px-4 py-10 mx-5 hide-scrollbar"
>
  <div class="flex gap-4">
    <div
      *ngFor="let item of items"
      class="min-w-[200px] max-w-[200px] bg-gray-800 rounded-lg shadow-md hover:scale-105 transition-transform duration-300 snap-start"
    >
      <img [src]="item.image" alt="Card" class="w-full h-32 object-cover rounded-t-lg" />
      <div class="p-2 text-white text-sm font-semibold">{{ item.title }}</div>
    </div>
  </div>
</div>
