<div class="bg-[#111] bg-opacity-70 text-white min-h-screen py-8 px-4 sm:px-6 md:px-12">
  <!-- Header -->
  <div class="mb-8 sm:mb-12">
    <h1 class="text-2xl sm:text-3xl md:text-5xl font-bold text-red-500 mb-4">
      My Projects
    </h1>
    <p class="text-sm sm:text-base md:text-xl text-gray-300">
      Showcasing my recent work across various technologies and platforms
    </p>
  </div>

  <!-- Projects Grid -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8">
    <div *ngFor="let project of projects"
      class="project-card bg-gray-900 rounded-lg overflow-hidden hover:scale-105 transition-transform duration-300 shadow-lg">

      <!-- Project Image -->
      <div class="relative h-48 sm:h-64 overflow-hidden bg-gray-800">
        <img 
          [src]="project.image" 
          [alt]="project.title"
          class="w-full h-full object-cover hover:scale-110 transition-transform duration-300"
        />
      </div>

      <!-- Project Content -->
      <div class="p-4 sm:p-6">
        <h2 class="text-lg sm:text-xl md:text-2xl font-bold text-red-500 mb-1">
          {{ project.title }}
        </h2>
        <p class="text-xs sm:text-sm text-red-400 mb-3">
          {{ project.subtitle }}
        </p>
        
        <p class="text-sm sm:text-base text-gray-300 mb-4">
          {{ project.description }}
        </p>

        <!-- Project Details -->
        <div class="space-y-2">
          <div *ngFor="let detail of project.details"
            class="flex items-start gap-2 text-xs sm:text-sm text-gray-400">
            <span class="text-red-500 mt-1">•</span>
            <span>{{ detail }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
