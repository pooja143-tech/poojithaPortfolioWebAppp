<header class="bg-[#111] border-b border-gray-700 py-4">
  <div class="flex items-center justify-between px-4 md:px-6">

    <!-- Logo + Tagline -->
    <div class="flex flex-col items-start">
      <h1 class="text-xl md:text-2xl font-bold text-red-500">Portfolio</h1>
      <p class="text-sm md:text-base text-gray-300">Welcome to My World</p>
    </div>

    <!-- Hamburger (Mobile only) -->
   <!-- Hamburger / Close Toggle -->
<button
  (click)="isMenuOpen = !isMenuOpen"
  class="md:hidden text-white focus:outline-none"
>
  <!-- Show Hamburger when menu is closed -->
  <svg *ngIf="!isMenuOpen" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6"
    fill="none" viewBox="0 0 24 24" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
      d="M4 6h16M4 12h16M4 18h16" />
  </svg>

  <!-- Show Close (X) when menu is open -->
  <svg *ngIf="isMenuOpen" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6"
    fill="none" viewBox="0 0 24 24" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
      d="M6 18L18 6M6 6l12 12" />
  </svg>
</button>

    <!-- Navigation (Desktop) -->
    <nav class="hidden md:flex gap-4">
      <a routerLink="/" routerLinkActive="!text-red-500 font-semibold"
        [routerLinkActiveOptions]="{ exact: true }"
        class="px-4 py-2 text-white hover:text-red-500 transition-colors">
        Home
      </a>
      <a routerLink="/profile" routerLinkActive="!text-red-500 font-semibold"
        [routerLinkActiveOptions]="{ exact: true }"
        class="px-4 py-2 text-white hover:text-red-500 transition-colors">
        Profile
      </a>
      <a routerLink="/skills" routerLinkActive="!text-red-500 font-semibold"
        [routerLinkActiveOptions]="{ exact: true }"
        class="px-4 py-2 text-white hover:text-red-500 transition-colors">
        Skills
      </a>
      <a routerLink="/projects" routerLinkActive="!text-red-500 font-semibold"
        [routerLinkActiveOptions]="{ exact: true }"
        class="px-4 py-2 text-white hover:text-red-500 transition-colors">
        Projects
      </a>
      <a routerLink="/my-night-sky" routerLinkActive="!text-red-500 font-semibold"
        [routerLinkActiveOptions]="{ exact: true }"
        class="px-4 py-2 text-white hover:text-red-500 transition-colors">
        My Night Sky
      </a>
    </nav>
  </div>

  <!-- Mobile Menu -->
  <div *ngIf="isMenuOpen" class="md:hidden px-4 mt-2 space-y-2">
    <a routerLink="/" class="block px-2 py-1 text-white hover:text-red-500">Home</a>
    <a routerLink="/profile" class="block px-2 py-1 text-white hover:text-red-500">Profile</a>
    <a routerLink="/skills" class="block px-2 py-1 text-white hover:text-red-500">Skills</a>
    <a routerLink="/projects" class="block px-2 py-1 text-white hover:text-red-500">Projects</a>
    <a routerLink="/my-night-sky" class="block px-2 py-1 text-white hover:text-red-500">My Night Sky</a>
  </div>
</header>
